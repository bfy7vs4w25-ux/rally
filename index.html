<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D rally</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--acc:#ff5a36;--acc2:#ff7a5c;--glass:rgba(14,16,23,0.62);--line:rgba(255,255,255,0.1);--mut:#9aa1ad}
html,body{margin:0;height:100%;background:#0b0e14;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#f3f4f6;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
#g{position:fixed;inset:0}
#cv{display:block;width:100%;height:100%;outline:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease,visibility 0s linear .35s}
.ov.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .35s ease}
#pause .pnl,#done .pnl{transform:scale(.95);transition:transform .4s cubic-bezier(.2,.9,.3,1.2)}#pause.on .pnl,#done.on .pnl{transform:none}
.gl{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,0.35)}
.pnl{border-radius:20px;color:#f3f4f6;box-sizing:border-box}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.fade{animation:fi .35s cubic-bezier(.2,.8,.2,1)}
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(90deg,rgba(6,8,12,0.7) 0%,rgba(6,8,12,0.25) 38%,rgba(6,8,12,0) 60%)}
.mp{position:absolute;left:20px;top:50%;transform:translateY(-50%);transform-origin:left center;width:min(410px,calc(100% - 40px));padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;transition:left .5s cubic-bezier(.2,.8,.2,1),opacity .4s}
#menu:not(.on) .mp{left:-40px;opacity:0}#vig.on{opacity:1}
.mp>*,#mb>*{flex-shrink:0}
@keyframes sf{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}@keyframes sb{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.sf{animation:sf .38s cubic-bezier(.2,.8,.2,1)}.sb{animation:sb .38s cubic-bezier(.2,.8,.2,1)}
.hero{font-size:30px;font-weight:600;line-height:1.15;letter-spacing:-.02em}
.cv1{width:100%;height:74px;display:block;border-radius:10px}.cv2{width:100%;height:50px;display:block}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;border:1px solid;margin-right:6px;line-height:1.5}
.co .ck{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:#ff5a36;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.4);opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.3,1.4);pointer-events:none}.co .ck svg.i{width:12px;height:12px;stroke-width:3.2}.co.sel .ck{opacity:1;transform:none}
.sws{display:flex;gap:11px;flex-wrap:wrap;padding:3px}
.box{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:9px 13px}
.box .kr:last-child,.box .prow:last-child{border-bottom:none}
.kv{display:flex;align-items:center;gap:7px;font-weight:500;text-align:right}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 3px rgba(0,0,0,0.3),0 0 0 1px rgba(255,255,255,0.25)}
.cdot.wait{background:transparent;border:2px dashed rgba(255,255,255,0.3);box-shadow:none;box-sizing:border-box;animation:spin 3s linear infinite}
.prow{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.pn{flex:1;display:flex;flex-direction:column;min-width:0}
.hmt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.hm>svg.i:last-child{opacity:.45;transition:transform .2s,opacity .2s}.hm:hover>svg.i:last-child{opacity:.9;transform:translateX(3px)}
.code{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(255,106,69,0.18),rgba(255,90,54,0.04));border:1px solid rgba(255,90,54,0.4)}
.code b{flex:1;font-size:28px;font-weight:600;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.ib.sm{width:36px;height:36px;background:rgba(255,255,255,0.1)}.gh.sm{height:34px;padding:0 12px;font-size:12px;border-radius:10px}
.inp{all:unset;box-sizing:border-box;width:100%;height:58px;border-radius:14px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);text-align:center;font-size:28px;font-weight:600;letter-spacing:.3em;color:#fff;transition:border-color .2s,box-shadow .2s;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:#ff5a36;box-shadow:0 0 0 4px rgba(255,90,54,0.2)}.inp::placeholder{color:rgba(255,255,255,0.18)}
.nst{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#c7ccd4;min-height:18px;line-height:1.4}
.dot{width:8px;height:8px;border-radius:50%;background:#ffb020;flex:none;animation:pulse 1.4s ease-in-out infinite}.dot.ok{background:#3ddc97;animation:none}.dot.bad{background:#ff5a5a;animation:none}
@keyframes pulse{50%{opacity:.35}}
.go.dis{filter:grayscale(1) brightness(.7);pointer-events:none;box-shadow:none}
.seg .ind{display:none}
.sg{position:relative;font-weight:500;transition:background .25s,color .25s,box-shadow .25s,transform .12s}.sg:active{transform:scale(.96)}
.sg.sel{background:linear-gradient(180deg,#ff6a45,#e9461f);color:#fff;font-weight:600;box-shadow:0 3px 12px rgba(255,90,54,0.35),inset 0 1px 0 rgba(255,255,255,0.25);text-shadow:0 1px 1px rgba(0,0,0,0.25)}
.sg:not(.sel):hover{background:rgba(255,255,255,0.09);color:#fff}
.sl.done{background:rgba(61,220,151,0.5)}.sd b svg.i{width:12px;height:12px;stroke-width:3}
.pt{font-size:18px;font-weight:600;line-height:1.3}
#prev{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;pointer-events:none}#prev.on{opacity:1;transform:none}
.hp{animation:fi .4s cubic-bezier(.2,.8,.2,1)}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-size:16px;font-weight:600;letter-spacing:.01em}
.logo i{width:28px;height:28px;border-radius:8px;display:block;background:conic-gradient(#fff 0 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/14px 14px;box-shadow:0 0 0 2px var(--acc)}
.mt{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.sec{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7f8794;margin:0 0 7px;font-weight:500}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button{font-family:inherit}
.co{all:unset;position:relative;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:8px;background:rgba(255,255,255,0.035);transition:border-color .18s,background .18s,transform .18s,box-shadow .18s;display:flex;flex-direction:column;gap:6px;min-width:0}
.co:hover{border-color:rgba(255,255,255,0.28);transform:translateY(-2px)}
.co.sel{border-color:var(--acc);background:rgba(255,90,54,0.12);box-shadow:0 0 0 1px var(--acc),0 8px 24px rgba(255,90,54,0.18)}
.co:focus-visible,.sg:focus-visible,.go:focus-visible,.gh:focus-visible,.hm:focus-visible,.ib:focus-visible,.sw:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.nm{font-size:13px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sub{font-size:11.5px;color:var(--mut);line-height:1.45}
.st{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);line-height:1.2}
.st span{width:62px;flex:none}.st b{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.1);overflow:hidden;display:block}.st b i{display:block;height:100%;background:linear-gradient(90deg,#ff8a5c,var(--acc));border-radius:2px}
.seg{display:flex;background:rgba(255,255,255,0.06);border-radius:12px;padding:3px;gap:3px}
.sg{all:unset;box-sizing:border-box;flex:1;min-width:0;text-align:center;cursor:pointer;font-size:13px;padding:9px 6px;border-radius:9px;color:#c7ccd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}

.go{all:unset;box-sizing:border-box;cursor:pointer;height:48px;padding:0 20px;border-radius:14px;background:linear-gradient(180deg,#ff6a45,#f04a26);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s;box-shadow:0 6px 20px rgba(255,90,54,0.35)}
.go:hover{filter:brightness(1.08)}.go:active{transform:scale(.98)}
.gh{all:unset;box-sizing:border-box;cursor:pointer;height:48px;padding:0 18px;border-radius:14px;background:rgba(255,255,255,0.08);color:#e8eaee;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.gh:hover{background:rgba(255,255,255,0.14)}
.mf{display:flex;gap:8px;margin-top:auto}
.hm{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,0.045);border:1px solid var(--line);transition:background .18s,border-color .18s,transform .18s}
.hm:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.22);transform:translateX(3px)}
.hm.pri{background:linear-gradient(135deg,rgba(255,106,69,0.22),rgba(255,90,54,0.06));border-color:rgba(255,90,54,0.45)}
.ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,90,54,0.16);color:var(--acc2);flex:none}
.stp{display:flex;gap:6px;align-items:center}
.sd{display:flex;align-items:center;gap:7px;font-size:12px;color:#7f8794;white-space:nowrap;font-weight:500}
.sd b{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;background:rgba(255,255,255,0.08);color:#c7ccd4;transition:background .2s}
.sd.on{color:#fff}.sd.on b{background:var(--acc);color:#fff;box-shadow:0 0 0 4px rgba(255,90,54,0.2)}.sd.ok b{background:rgba(61,220,151,0.18);color:#3ddc97}
.sl{flex:1;height:2px;border-radius:1px;background:rgba(255,255,255,0.1);min-width:6px}
.sw{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;box-sizing:border-box;border:2px solid rgba(255,255,255,0.2);transition:transform .15s;box-shadow:inset 0 -6px 10px rgba(0,0,0,0.25),inset 0 4px 8px rgba(255,255,255,0.25)}
.sw:hover{transform:scale(1.12)}.sw.sel{border-color:#fff;outline:2px solid var(--acc);outline-offset:3px}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.16);border-bottom-width:3px;font-size:11px;font-weight:500;color:#e5e7eb;box-sizing:border-box}
.kr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:13px;color:#d6d9df}
.hp{position:absolute;border-radius:14px;color:#fff;display:none;box-sizing:border-box}
.hr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;line-height:1.6}
.hk{font-size:11px;color:var(--mut)}.hv{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.ib{all:unset;box-sizing:border-box;cursor:pointer;width:40px;height:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:background .15s}
.ib:hover{background:rgba(40,44,54,0.9)}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tw{display:flex;align-items:center;gap:7px;font-size:12px;height:22px;padding:0 7px;border-radius:7px;font-variant-numeric:tabular-nums;transition:background .3s}
.lamp{width:30px;height:30px;border-radius:50%;background:#262a33;box-shadow:inset 0 2px 6px rgba(0,0,0,0.6);transition:background .08s,box-shadow .08s}
.lamp.r{background:#ff2d2d;box-shadow:0 0 18px #ff2d2d,inset 0 -3px 6px rgba(0,0,0,0.3)}.lamp.g{background:#2ee66b;box-shadow:0 0 18px #2ee66b,inset 0 -3px 6px rgba(0,0,0,0.3)}
.msg{position:absolute;left:50%;transform:translate(-50%,-50%);display:none;padding:10px 20px;border-radius:14px;color:#fff;font-size:17px;font-weight:600;white-space:nowrap;pointer-events:none;align-items:center;gap:8px}
#toast{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(.85);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.3,1.3);pointer-events:none;padding:10px 26px;border-radius:14px;color:#fff;font-size:21px;font-weight:600;white-space:nowrap}
.pill2{display:none;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;color:#fff;font-size:12px;font-weight:500}
.rw{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:9px;font-size:13px}
#tp{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:16px;pointer-events:none}
.tb{all:unset;pointer-events:auto;touch-action:none;width:66px;height:66px;border-radius:18px;background:rgba(10,12,18,0.5);border:1px solid rgba(255,255,255,0.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500}
.tb.on{background:rgba(255,90,54,0.6)}
#load{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0b0e14;color:var(--mut);font-size:14px;z-index:9;transition:opacity .4s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,0.12);border-top-color:var(--acc);animation:spin .8s linear infinite}

.it{animation:fi .45s cubic-bezier(.2,.8,.2,1) both}
.ver{font-size:10.5px;font-weight:600;color:#ffb39f;background:rgba(255,90,54,0.16);border:1px solid rgba(255,90,54,0.35);padding:1px 7px;border-radius:20px;margin-left:2px;letter-spacing:.02em}
@keyframes flash{0%{color:#3ddc97;transform:scale(1.35)}100%{color:#fff;transform:scale(1)}}#hP{display:inline-block;transform-origin:left bottom}#hP.flash{animation:flash .7s cubic-bezier(.2,.8,.2,1)}
#nit{right:16px;bottom:200px;width:180px;padding:9px 12px 10px}
#nit .nh{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--mut);margin-bottom:7px}#nit .nh b{margin-left:auto;color:#fff;font-size:13px;font-variant-numeric:tabular-nums;font-weight:600}
#nit .nh svg.i{width:15px;height:15px;color:#6aa8ff}
#nit .nb{height:8px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden;position:relative}
#nitF{height:100%;width:50%;border-radius:4px;background:linear-gradient(90deg,#3a7bff,#6fd3ff);transition:width .12s linear,background .3s}
#nit.low #nitF{background:linear-gradient(90deg,#a33,#ff6b5a)}
#nit.rdy{border-color:rgba(106,168,255,0.35)}
#nit.act{border-color:rgba(120,190,255,0.8);box-shadow:0 0 0 1px rgba(120,190,255,0.5),0 0 26px rgba(80,160,255,0.45)}
#nit.act #nitF{background:linear-gradient(90deg,#8fd0ff,#ffffff)}
@keyframes nb{50%{filter:brightness(1.35)}}#nit.act .nb{animation:nb .35s infinite}
.kc.mini{min-width:auto;height:18px;font-size:10px;padding:0 5px;border-bottom-width:2px}
#load .logo{font-size:22px}
#g.fsm #hTL{top:84px}#g.fsm #tower{top:260px}#g.fsm .mp{top:calc(50% + 30px)}
.seg.wrap{flex-wrap:wrap}.seg.wrap .sg{flex:1 1 30%}
.sw.sm{width:24px;height:24px}
.co .nm,.co .sub{padding-right:2px}.co.sel .nm{padding-right:26px}
@media (max-width:560px),(max-height:520px){.tb{width:54px;height:54px;border-radius:14px}}
#dlt{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:6px;display:none}

#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(120% 85% at 50% 35%,#1a2232 0%,#0b0e15 58%,#05070a 100%);color:#fff;transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1);cursor:default;-webkit-user-select:none;user-select:none}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash .glow{position:absolute;width:70vmin;height:70vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,110,60,.18),transparent 65%);top:50%;left:50%;transform:translate(-50%,-62%);animation:spGlow 4s ease-in-out infinite}
.spStage{position:relative;width:min(560px,90vw);display:flex;flex-direction:column;align-items:center}
.spCar{width:min(400px,74vw);animation:spIn 1.3s cubic-bezier(.16,.84,.24,1) both}
.spCar svg{width:100%;display:block;overflow:visible;animation:spBob 1.4s ease-in-out infinite}
.spWh{transform-box:fill-box;transform-origin:center;animation:spSpin .32s linear infinite}
.spRoad{width:100%;height:3px;margin-top:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 26px,transparent 26px 58px);animation:spRoad .32s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent)}
.spLn{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55));animation:spLn 1.1s linear infinite;opacity:0}
.spLogo{margin-top:34px;font-size:clamp(38px,8vw,68px);font-weight:800;letter-spacing:.05em;line-height:1;background:linear-gradient(100deg,#fff 0%,#fff 42%,#ffb070 50%,#fff 58%,#fff 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:spShine 3.2s ease-in-out infinite,spUp .9s .35s cubic-bezier(.2,.8,.2,1) both}
.spTag{margin-top:10px;color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.32em;text-transform:uppercase;animation:spUp .9s .5s cubic-bezier(.2,.8,.2,1) both}
.spBar{width:min(240px,60vw);height:3px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:36px;overflow:hidden;transition:opacity .4s}
.spBar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,#ff6a2a,#ffc56b);transition:width .45s ease}
.spGo{position:absolute;bottom:-6px;left:50%;transform:translate(-50%,10px);opacity:0;pointer-events:none;padding:14px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:inherit;font-weight:700;font-size:15px;letter-spacing:.06em;white-space:nowrap;transition:opacity .6s,transform .6s cubic-bezier(.2,.8,.2,1)}
.spFoot{position:relative;height:60px;width:100%;display:flex;justify-content:center}
#splash.ready .spBar{opacity:0}
#splash.ready .spGo{opacity:1;transform:translate(-50%,0);animation:spPulse 2s ease-in-out .6s infinite}
#splash .ver{position:absolute;bottom:18px;right:20px;color:rgba(255,255,255,.35);font-size:12px}
@keyframes spIn{0%{transform:translateX(-70vw) skewX(-8deg);opacity:0}70%{transform:translateX(2vw) skewX(2deg);opacity:1}100%{transform:none}}
@keyframes spBob{50%{transform:translateY(-1.5px)}}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spRoad{to{background-position:-58px 0}}
@keyframes spLn{0%{transform:translateX(40px);opacity:0}20%{opacity:1}100%{transform:translateX(-260px);opacity:0}}
@keyframes spShine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spGlow{50%{opacity:.6;transform:translate(-50%,-62%) scale(1.08)}}
@keyframes spPulse{50%{box-shadow:0 0 0 8px rgba(255,120,60,.12);border-color:rgba(255,160,100,.5)}}
#intro{position:absolute;inset:0;z-index:7;pointer-events:none}
#intro.on{pointer-events:auto}
#intro .lb{position:absolute;left:0;right:0;height:11vh;background:#000;transition:transform .9s cubic-bezier(.7,0,.2,1)}
#intro .lb.t{top:0;transform:translateY(-101%)}#intro .lb.b{bottom:0;transform:translateY(101%)}
#intro.on .lb{transform:none}
